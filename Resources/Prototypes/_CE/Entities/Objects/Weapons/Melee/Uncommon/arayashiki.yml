- type: entity
  id: CEWeaponSwordArayashiki
  name: unsheathed arayashiki
  description: Old artifact that inflicts eternal wounds, severing user's memories.
  parent: CEBaseWeapon
  components:
  - type: Sprite
    sprite: _CE/Objects/Weapons/Sword/iron.rsi
    state: icon
  - type: CEWeapon
    animations:
      Primary:
      - anim: SwordAttackLight1
      - anim: SwordAttackLight2
      Secondary:
      - anim: SwordAttackHeavy1
        speed: 1.2
      - anim: SwordAttackHeavy2
        speed: 1.2
    effectSlots:
      OnHit:
      - !type:WeaponArcAttack
        range: 0.7
        arcWidth: 40
        effects:
        - !type:Damage
          attackType: Melee
          damage:
            types:
              Physical: 10
      OnHeavyHit:
      - !type:WeaponArcAttack
        range: 0.6
        arcWidth: 180
        effects:
        - !type:Damage
          attackType: Melee
          damage:
            types:
              Physical: 10
  - type: CEWeaponStaminaCost
    costs:
      Primary: 1
      Secondary: 1
  - type: Clothing
    slots:
    - neck
