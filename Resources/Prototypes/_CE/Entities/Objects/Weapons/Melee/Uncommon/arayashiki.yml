- type: entity
  id: CEWeaponKatanaArayashiki
  name: arayashiki
  description: Old artifact that inflicts eternal wounds, severing user's memories.
  parent: CEBaseWeapon
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/energykatana.rsi
    state: icon
  - type: CEWeapon
    animations:
      Primary:
      - anim: SwordAttackLight1
      - anim: SwordAttackLight2
      Secondary:
      - anim: SwordAttackHeavy1
        speed: 1.2
      - anim: SwordAttackHeavy2
        speed: 1.2
    effectSlots:
      OnHit:
      - !type:WeaponArcAttack
        range: 0.7
        arcWidth: 40
        effects:
        - !type:Damage
          attackType: Melee
          damage:
            types:
              Physical: 10
      - !type:ApplyStatusEffectStack
        effectTarget: User
        statusEffect: CEStatusEffectSeveredMemories
        amount: 5
        max: 100
      OnHeavyHit:
      - !type:WeaponArcAttack
        range: 0.6
        arcWidth: 180
        effects:
        - !type:Damage
          attackType: Melee
          damage:
            types:
              Physical: 10
  - type: CEWeaponStaminaCost
    costs:
      Primary: 1
      Secondary: 1
  - type: Clothing
    slots:
    - neck

- type: entity
  id: CEWeaponKatanaArayashikiSheath
  name: arayashiki sheath
  description: Sheath that must be used instead of contained blade.
  parent:
  - CEClothingBaseSheathNeck
  - CEBaseWeapon

- type: Tag
  id: CESwordArayashiki

